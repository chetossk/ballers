<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo | Ballers</title>
  <link rel="stylesheet" href="./css/base.css"/>
  <style>
    /* Estilos extra para feedback visual */
    .btn-success { background-color: #25D366 !important; border-color: #25D366 !important; }
    .muted { font-size: 0.85rem; color: #888; display: block; margin-top: 8px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="./index.html">Ballers <span aria-hidden="true">🏀👟</span></a>

      <button class="nav__toggle" aria-expanded="false" aria-controls="mainnav">☰</button>
      <nav id="mainnav" class="nav">
        <ul>
          <li><a href="./index.html">Inicio</a></li>
          <li><a class="active" href="./catalog_user.html" aria-current="page">Catálogo</a></li>
          <li><a href="./cart.html">Carrito</a></li>
          <li><a href="./comprados.html">Mis Compras</a></li>
          <li><a href="./seguimiento.html">Seguimiento</a></li>
          <li><a href="./editar.html">Mi Perfil</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="filters">
    <div class="container filters__inner">
      <div class="chips">
        <button class="chip is-active" data-cat="todo">Todo</button>
        <button class="chip" data-cat="sneakers">Sneakers</button>
        <button class="chip" data-cat="jerseys">Jerseys</button>
        <button class="chip" data-cat="gorras">Gorras</button>
        <button class="chip" data-cat="accesorios">Accesorios</button>
      </div>

      <div class="sort">
        <label for="orden">Ordenar:</label>
        <select id="orden">
          <option value="popular">Más populares</option>
          <option value="nuevo">Novedades</option>
          <option value="precio-asc">Precio: bajo a alto</option>
          <option value="precio-desc">Precio: alto a bajo</option>
        </select>
      </div>
    </div>
  </section>

  <main class="container">
    <section id="product-grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <small>© 2026 Ballers Store. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script>
  (async () => {
    const grid   = document.getElementById('product-grid');
    const chips  = Array.from(document.querySelectorAll('.chip'));
    const select = document.getElementById('orden');

    const money = n => Number(n).toLocaleString('es-MX', { style:'currency', currency:'MXN' });

    // Normalización para SCM e inventario
    const normalizeCategory = (cat) => {
      const c = String(cat || '').toLowerCase().trim();
      const map = {
        'ropa': 'jerseys',
        'jersey': 'jerseys',
        'jerseys': 'jerseys',
        'gorra': 'gorras',
        'gorras': 'gorras',
        'calzado': 'sneakers',
        'tenis': 'sneakers',
        'sneakers': 'sneakers',
        'accesorios': 'accesorios'
      };
      return map[c] || c;
    };

    const fixImg = (p) => {
      if (!p) return '';
      if (/^https?:\/\//i.test(p)) return p;
      if (p.startsWith('src/')) return '/' + p.replace(/^src\//, '');
      return p;
    };

    let products = [];
    try {
      const res = await fetch('/api/productos', { cache: 'no-store' });
      if (!res.ok) throw new Error('No se pudo cargar el catálogo');
      const data = await res.json();

      products = data.map(p => ({
        id: p.id,
        name: p.name,
        price: Number(p.price),
        category: normalizeCategory(p.category),
        image: fixImg(p.image),
        createdAt: p.createdAt || null,
        popularity: p.popularity || 0
      }));
    } catch (err) {
      grid.innerHTML = `<p>Error: ${err.message}</p>`;
      return;
    }

    function cardTemplate(p) {
      const bg = p.image
        ? `background:url('${p.image}') center/cover no-repeat`
        : `background:linear-gradient(135deg, #222, #111)`;

      return `
        <article class="card" data-category="${p.category}">
          <div class="card__img" style="${bg}"></div>
          <div class="card__body">
            <h3 class="card__title">${p.name}</h3>
            <p class="card__price">${money(p.price)}</p>
            <div class="card__actions">
              <button class="btn btn--ghost" type="button">♡</button>
              <button class="btn" type="button" data-add="${p.id}">
                Añadir al carrito
              </button>
            </div>
            <p class="muted" data-msg="${p.id}"></p>
          </div>
        </article>`;
    }

    let current = [...products];

    function render() {
      grid.innerHTML = current.length ? current.map(cardTemplate).join('') : '<p>No hay productos.</p>';
    }

    // Lógica de filtrado y ordenamiento
    chips.forEach(chip => chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('is-active'));
      chip.classList.add('is-active');
      const cat = chip.dataset.cat;
      current = cat === 'todo' ? [...products] : products.filter(p => p.category === cat);
      render();
    }));

    render();

    // ✅ LÓGICA DE CARRITO CORREGIDA
    grid.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-add]');
      if (!btn) return;

      // 1. Validar sesión desde localStorage
      const userId = localStorage.getItem('ballers_user_id'); 
      if (!userId) {
        alert("Inicia sesión para comprar en Ballers Store.");
        window.location.href = 'login.html';
        return;
      }

      const productId = btn.dataset.add;
      const msgEl = document.querySelector(`[data-msg="${productId}"]`);

      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Procesando...';

      try {
        const resp = await fetch('/api/carrito', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // 2. Enviamos el usuario_id para que el ERP lo registre
          body: JSON.stringify({ 
            usuario_id: userId, 
            producto_id: productId, 
            cantidad: 1 
          })
        });

        if (!resp.ok) throw new Error('Error al conectar con el servidor');

        // 3. Feedback visual de éxito
        btn.classList.add('btn-success');
        btn.textContent = '¡Agregado! ✓';
        if (msgEl) msgEl.textContent = 'Producto listo en tu carrito.';

        setTimeout(() => {
          btn.disabled = false;
          btn.classList.remove('btn-success');
          btn.textContent = originalText;
          if (msgEl) msgEl.textContent = '';
        }, 2000);

      } catch (err) {
        alert("Hubo un problema: " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  })();
  </script>
</body>
</html>
