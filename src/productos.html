<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos | Ballers Admin</title>
  <style>
    :root { 
      --primary: #ff6a00; --panel: #141419; --bg: #0b0b0f; 
      --radius: 12px; --muted: #888; --shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
    .form-container {
      max-width: 650px; margin: 40px auto; background: var(--panel);
      padding: 30px; border-radius: var(--radius); border: 1px solid #23232a; box-shadow: var(--shadow);
    }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--muted); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px; background: #000; border: 1px solid #2a2a32;
      border-radius: 8px; color: white; font-size: 1rem; box-sizing: border-box;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn-block { 
      width: 100%; padding: 15px; background: var(--primary); border: none; 
      color: white; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 8px;
    }
    .btn-block:hover { background: #e65a00; }
  </style>
</head>
<body>

  <main class="container">
    <div class="form-container">
      <h2>Agregar Nuevo Producto</h2>
      <p style="color:var(--muted)">Llena los campos para actualizar el catálogo y configurar la lógica SCM.</p>
      <hr style="border: 0; border-top: 1px solid #23232a; margin: 20px 0;">

      <form id="product-form">
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="nombre" placeholder="Ej. Jordan 4 Retro Military Blue" required>
        </div>

        <div class="form-group">
          <label>Descripción / Detalles</label>
          <textarea id="descripcion" rows="2" placeholder="Breve descripción del artículo..."></textarea>
        </div>

        <div class="grid">
          <div class="form-group">
            <label>Precio ($MXN)</label>
            <input type="number" id="precio" step="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label>Stock Inicial</label>
            <input type="number" id="stock" placeholder="Cantidad" required>
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label>Stock Mínimo (Alerta)</label>
            <input type="number" id="stock_minimo" value="5" required>
          </div>
          <div class="form-group">
            <label>Estrategia Logística</label>
            <select id="estrategia">
              <option value="PULL">PULL (Manual)</option>
              <option value="PUSH">PUSH (Automática)</option>
            </select>
          </div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label>Categoría</label>
            <select id="categoria">
              <option value="sneakers">Sneakers</option>
              <option value="jerseys">Jerseys</option>
              <option value="gorras">Gorras</option>
              <option value="accesorios">Accesorios</option>
            </select>
          </div>
          <div class="form-group">
            <label>Imagen (nombre archivo)</label>
            <input type="text" id="imagen" placeholder="nombre-archivo.jpg">
          </div>
        </div>

        <button type="submit" class="btn-block">Guardar en Base de Datos</button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const producto = {
        nombre: document.getElementById('nombre').value,
        descripcion: document.getElementById('descripcion').value,
        precio: parseFloat(document.getElementById('precio').value),
        stock_actual: parseInt(document.getElementById('stock').value),
        stock_minimo: parseInt(document.getElementById('stock_minimo').value),
        estrategia_logistica: document.getElementById('estrategia').value,
        categoria: document.getElementById('categoria').value,
        imagen: document.getElementById('imagen').value
      };

      try {
        const response = await fetch('/api/productos/nuevo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(producto)
        });
        const data = await response.json();
        if (data.ok) {
          alert('✅ ¡Éxito! Producto guardado.');
          window.location.href = 'metricas.html';
        }
      } catch (error) {
        alert('❌ Error de conexión');
      }
    });
  </script>
</body>
</html>
